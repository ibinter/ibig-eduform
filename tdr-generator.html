<style>
/* ── Tokens ─────────────────────────────────────────────────── */
:root {
  --navy:    #0D1B3E;
  --blue:    #1B5ED8;
  --blue-lt: #E8EFFC;
  --gold:    #F5A51A;
  --gold-lt: #FEF3DC;
  --ink:     #1A2540;
  --muted:   #64748B;
  --line:    #E2E8F0;
  --surface: #F4F6FC;
  --bg:      #FFFFFF;
  --panel:   #F8FAFF;
  --font-display: 'Outfit', system-ui, sans-serif;
  --font-body:    'Inter', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; overflow: hidden;
  font-family: var(--font-body);
  font-size: 14px; line-height: 1.6;
  color: var(--ink); background: var(--bg);
}

/* ── Top bar ─────────────────────────────────────────────────── */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; gap: 14px;
  padding: 0 20px; height: 54px;
  background: var(--navy);
  border-bottom: 2px solid var(--gold);
}
.topbar .lm {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, var(--gold), #e0940f);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 800; font-size: 13px;
  color: #0D1B3E; flex: 0 0 auto;
}
.topbar h1 {
  font-family: var(--font-display); font-size: 15px; font-weight: 700;
  color: #fff; flex: 1; letter-spacing: .2px;
}
.topbar h1 small {
  display: block; font-size: 10px; font-weight: 500;
  opacity: .65; letter-spacing: .5px; text-transform: uppercase;
}
.topbar .tabs { display: none; gap: 4px; }
.tab-btn {
  padding: 5px 14px; border-radius: 6px; border: 0;
  font-size: 12px; font-weight: 600; cursor: pointer;
  background: rgba(255,255,255,.12); color: rgba(255,255,255,.7);
  transition: .15s;
}
.tab-btn.active { background: var(--gold); color: #0D1B3E; }

/* ── Layout ──────────────────────────────────────────────────── */
.layout {
  position: fixed; top: 54px; bottom: 0; left: 0; right: 0;
  display: flex;
}

/* ── Form panel ──────────────────────────────────────────────── */
.fp {
  flex: 0 0 370px;
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.fs {
  flex: 1 1 0; overflow-y: auto;
  padding: 18px 16px;
  display: flex; flex-direction: column; gap: 14px;
}
.fs::-webkit-scrollbar { width: 4px; }
.fs::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

.sl {
  font-family: var(--font-display);
  font-size: 10px; font-weight: 700;
  letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 8px;
  padding-bottom: 5px; border-bottom: 1px solid var(--line);
}
.fi { display: flex; flex-direction: column; gap: 4px; }
.fi label { font-size: 12px; font-weight: 600; color: var(--ink); }
.fi input, .fi select, .fi textarea {
  width: 100%; padding: 8px 10px;
  background: var(--bg); border: 1px solid var(--line);
  border-radius: 7px; color: var(--ink);
  font-family: var(--font-body); font-size: 13px;
  outline: none; transition: border-color .15s, box-shadow .15s;
}
.fi input:focus, .fi select:focus, .fi textarea:focus {
  border-color: var(--blue); box-shadow: 0 0 0 3px rgba(27,94,216,.12);
}
.fi textarea { resize: vertical; min-height: 68px; }
.fi .hint { font-size: 11px; color: var(--muted); }
.r2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.g { display: flex; flex-direction: column; gap: 10px; }

/* Form actions */
.fa {
  flex: 0 0 auto; padding: 10px 14px;
  border-top: 1px solid var(--line);
  display: flex; gap: 8px; align-items: center;
}
.btn-pdf {
  flex: 1; padding: 10px;
  background: linear-gradient(135deg, #e08010, var(--gold));
  color: #0d1b3e; border: 0; border-radius: 8px;
  font-family: var(--font-display); font-size: 13px; font-weight: 800;
  cursor: pointer; transition: opacity .15s;
}
.btn-pdf:hover { opacity: .88; }
.btn-pdf:disabled { opacity: .5; }
.btn-copy {
  padding: 10px 14px; border-radius: 8px;
  background: var(--blue-lt); border: 1px solid var(--blue);
  color: var(--blue); font-size: 12px; font-weight: 700;
  cursor: pointer; transition: background .15s;
}
.btn-copy:hover { background: #d2e3fd; }
.btn-rst {
  padding: 10px 12px; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--line);
  color: var(--muted); font-size: 13px; cursor: pointer;
}
.btn-rst:hover { background: var(--line); }

/* ── Preview panel ───────────────────────────────────────────── */
.pp {
  flex: 1 1 0; overflow-y: auto;
  background: #d8dff0; padding: 28px 20px;
  display: flex; flex-direction: column; align-items: center;
}
.pp::-webkit-scrollbar { width: 6px; }
.pp::-webkit-scrollbar-thumb { background: #b0bdd8; border-radius: 3px; }

/* ── TDR Sheet ───────────────────────────────────────────────── */
#tdrSheet {
  width: 100%; max-width: 820px;
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 20px 60px rgba(10,20,50,.22);
  overflow: hidden;
  font-family: 'Inter', Arial, sans-serif;
  color: #1a2540;
}
#tdrSheet ul { padding-left: 18px; margin: 4px 0; }
#tdrSheet ul li { margin: 4px 0; font-size: 13.5px; line-height: 1.55; }
#tdrSheet .tdr-mod {
  background: #f8faff; border: 1px solid #e2e8f0;
  border-left: 4px solid #f5a51a;
  border-radius: 8px; padding: 12px 14px; margin: 8px 0;
}
#tdrSheet .tdr-mod h4 {
  font-size: 13px; font-weight: 800; margin-bottom: 6px;
  display: flex; align-items: center; gap: 7px;
}
#tdrSheet .tdr-mod h4 .mn {
  width: 20px; height: 20px; border-radius: 5px;
  background: #f5a51a; color: #0d1b3e;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; flex: 0 0 auto;
}
#tdrSheet .tdr-mod ul { padding-left: 16px; }
#tdrSheet .tdr-mod ul li { font-size: 12.5px; color: #2a3a5c; margin: 3px 0; }
#tdrSheet .tdr-tarifs {
  display: grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr));
  gap: 10px; margin-top: 8px;
}
#tdrSheet .tdr-tarif {
  border: 1px solid #e2e8f0; border-radius: 10px;
  padding: 12px; text-align: center; background: #f8faff;
}
#tdrSheet .tdr-tarif span {
  display: block; font-size: 11px; color: #64748b;
  text-transform: uppercase; letter-spacing: .4px;
}
#tdrSheet .tdr-tarif b { display: block; font-size: 16px; font-weight: 800; margin-top: 3px; }
#tdrSheet .tdr-cert {
  background: linear-gradient(135deg,rgba(245,165,26,.12),rgba(27,94,216,.06));
  border: 1px solid rgba(245,165,26,.35);
  border-radius: 10px; padding: 14px; margin-top: 8px;
}
#tdrSheet .tdr-cert .ttl { font-weight: 800; }

/* PDF mode */
body.pdf-mode { overflow: auto; }
body.pdf-mode .topbar, body.pdf-mode .fp,
body.pdf-mode .pp { padding: 0; }
body.pdf-mode .layout { position: static; }
body.pdf-mode .pp { display: block; background: #fff; padding: 0; }
body.pdf-mode #tdrSheet {
  max-width: none; border-radius: 0;
  box-shadow: none; margin: 0;
}

/* ── Toast ───────────────────────────────────────────────────── */
#toast {
  position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
  background: #1a2540; color: #fff;
  padding: 10px 20px; border-radius: 8px;
  font-size: 13px; font-weight: 600; z-index: 999;
  box-shadow: 0 8px 24px rgba(0,0,0,.3);
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
#toast.show { opacity: 1; }

/* ── Mobile ──────────────────────────────────────────────────── */
@media (max-width: 680px) {
  html, body { overflow: auto; height: auto; }
  .layout { position: static; flex-direction: column; }
  .fp { flex: 0 0 auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .fs { overflow: visible; }
  .pp { min-height: 600px; }
  .topbar .tabs { display: flex; }
  .fp[data-tab="hidden"] { display: none; }
  .pp[data-tab="hidden"] { display: none; }
  #tdrSheet .tdr-runhead,
  #tdrSheet .tdr-toc,
  #tdrSheet .tdr-body,
  #tdrSheet .tdr-footer,
  #tdrSheet .tdr-runfoot { padding-left: 22px !important; padding-right: 22px !important; }
}
</style>
</head>

/* ── Helpers ─────────────────────────────────────────────────── */
const fcfa = n => new Intl.NumberFormat('fr-FR').format(Math.round(n)) + ' F CFA';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const hash = s => { let h=0; for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;} return Math.abs(h); };

function extractTopics(desc) {
  const m = desc.match(/:\s*(.+)$/s); if (!m) return [];
  let raw = m[1].split(/\.\s+[A-ZÀÂÉÈÊÙÛÎÏ]/u)[0];
  raw = raw.replace(/\s*\([^)]*\)/g,'');
  return raw.split(/[,;]\s*/u).map(t=>t.trim()).filter(t=>t.length>=8&&t.length<=90);
}

function buildModules(name, heures, cat, desc) {
  let nb = 5;
  if(heures>=25)nb=6; if(heures>=30)nb=7; if(heures>=35)nb=8;
  if(heures>=45)nb=9; if(heures>=65)nb=10;

  let topics = extractTopics(desc);
  if(topics.length<2) {
    topics = name.replace(/\s*\([^)]*\)/g,'').split(/\s*[&,]\s*|\s+[eé]t\s+/ui).map(t=>t.trim()).filter(t=>t.length>4);
  }
  const fillers = [...(FILLERS[cat]||[]), ...FILLERS_GEN];
  const mods = [];
  let bi=0;

  mods.push({t:`${name} : périmètre, enjeux et positionnement professionnel`, b:[
    "Ce que recouvre exactement ce domaine et où s'arrête la responsabilité du praticien",
    "Acteurs en présence, textes de référence et pratiques du marché en Afrique francophone",
    "Autodiagnostic et identification des axes prioritaires de progression",
  ]});

  let idx=2;
  for(const topic of topics){
    if(idx>nb-2) break;
    const t=topic.charAt(0).toUpperCase()+topic.slice(1).toLowerCase();
    mods.push({t, b:BSETS[bi%BSETS.length]}); bi++; idx++;
  }
  let fi=0;
  while(idx<=nb-2&&fi<fillers.length){ mods.push(fillers[fi]); fi++; idx++; }

  mods.push({t:"Mise en pratique : cas d'entreprises et travaux dirigés", b:[
    "Traitement de dossiers et scénarios tirés d'entreprises réelles (Côte d'Ivoire, Afrique de l'Ouest)",
    "Travaux individuels et en binôme avec correction commentée par le formateur",
    "Projet de synthèse : production d'un livrable professionnel complet",
  ]});
  mods.push({t:"Évaluation finale et remise du certificat", b:[
    "Évaluation écrite et pratique couvrant l'ensemble du programme",
    "Présentation et défense du projet de synthèse devant le formateur",
    "Remise du certificat IBIG EDUFORM et construction du plan de développement post-formation",
  ]});
  return mods;
}

function getTheme(titre) {
  const seed = hash(titre||'default');
  const hue = seed%360, ha=(hue+38)%360, ha2=(hue+205)%360;
  return {
    pr: `hsl(${hue},72%,44%)`,
    dk: `hsl(${hue},52%,11%)`,
    go: `hsl(${ha},90%,60%)`,
    a2: `hsl(${ha2},82%,62%)`,
    ga: [120,135,160,205][(seed>>2)%4],
    nr: ['8px','50%','45% 55% 50% 50%'][seed%3],
  };
}

/* ── PDF export (html2pdf.js) ────────────────────────────────── */
function exportPDF() {
  const f = getForm();
  const btn = document.getElementById('btnPdf');
  const old = btn.textContent; btn.textContent = '⏳ Génération…'; btn.disabled = true;

  window.scrollTo(0,0);
  document.body.classList.add('pdf-mode');

  const slug = f.titre.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const fname = 'TDR-IBIG-EDUFORM-' + slug.toUpperCase() + '.pdf';

  const opt = {
    margin: [8,0,16,0],
    filename: fname,
    image: {type:'jpeg', quality:0.98},
    html2canvas: {scale:2, useCORS:true, backgroundColor:'#ffffff', scrollX:0, scrollY:0},
    jsPDF: {unit:'mm', format:'a4', orientation:'portrait'},
    pagebreak: {mode:['css','legacy']},
  };

  setTimeout(() => {
    html2pdf().set(opt).from(document.getElementById('tdrSheet')).toPdf().get('pdf').then(pdf => {
      const total = pdf.internal.getNumberOfPages();
      const w = pdf.internal.pageSize.getWidth();
      const h = pdf.internal.pageSize.getHeight();
      const ref = 'TDR-' + Math.abs(f.titre.split('').reduce((a,c)=>((a<<5)-a)+c.charCodeAt(0)|0,0)).toString(16).toUpperCase().slice(0,8);
      for(let i=1;i<=total;i++){
        pdf.setPage(i);
        pdf.setDrawColor(206,214,230); pdf.setLineWidth(0.25);
        pdf.line(12,h-11,w-12,h-11);
        pdf.setFont('helvetica','normal'); pdf.setFontSize(7.5); pdf.setTextColor(120,132,156);
        pdf.text('IBIG EDUFORM',12,h-6.5);
        pdf.text(ref,w/2,h-6.5,{align:'center'});
        pdf.text('Page '+i+' / '+total,w-12,h-6.5,{align:'right'});
      }
    }).save().then(()=>{
      btn.textContent = old; btn.disabled = false;
      document.body.classList.remove('pdf-mode');
      showToast('✅ PDF téléchargé');
    }).catch(()=>{
      btn.textContent = old; btn.disabled = false;
      document.body.classList.remove('pdf-mode');
      showToast('❌ Erreur PDF — essayez avec le bouton 📋 HTML');
    });
  }, 120);
}

/* ── Toast ───────────────────────────────────────────────────── */
function showToast(msg,dur=3200){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),dur);
}

/* ── Mobile tabs ─────────────────────────────────────────────── */
function switchTab(tab){
  const pF=document.getElementById('panelForm'), pP=document.getElementById('panelPreview');
  const bF=document.getElementById('tabF'), bP=document.getElementById('tabP');
  if(tab==='form'){pF.removeAttribute('data-tab');pP.setAttribute('data-tab','hidden');bF.classList.add('active');bP.classList.remove('active');}
  else{pP.removeAttribute('data-tab');pF.setAttribute('data-tab','hidden');bP.classList.add('active');bF.classList.remove('active');}
}

/* ── Debounced live update ───────────────────────────────────── */
let tmr;
document.querySelectorAll('input,select,textarea').forEach(el=>{
  el.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(renderTDR,400); });
  el.addEventListener('change',()=>{ clearTimeout(tmr); tmr=setTimeout(renderTDR,200); });
});
